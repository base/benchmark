name: B20 Precompile - new recipients (10M state, 800 blocks, caching study)
block_time: "2s"

payloads:
  - name: B20 native precompile / new recipients (10M state, 800 blocks)
    id: precompile-new-800blocks
    type: load-test
    config_file: ./load-tests/b20-evm-openloop-new-1000blocks.yaml

benchmarks:
  - snapshot:
      command: ./scripts/zfs-clone-b20-10m.sh
      superchain_chain_id: 8453
      genesis_file: ./configs/genesis/base-mainnet-beryl.json
      force_clean: false
    roles:
      - sequencer
    variables:
      - type: payload
        value: precompile-new-800blocks
      - type: node_type
        value: builder
      - type: num_blocks
        value: 800
      - type: gas_limit
        value: 4000000000
